# List the client's related repositories and look up code in them, read only, cited by repo and commit

## User Input (list, refresh [<id>], find <text> [--repo <id>] [--path <glob>], add <github_url> --id <id> --role <role>, remove <id>, or check)

{{args}}

## Path Configuration

- **Projects**: `.wire` (project data and status files)

When following the workflow specification below, resolve paths as follows:
- `.wire/` in specs refers to the `.wire/` directory in the current repository
- `TEMPLATES/` references refer to the templates section embedded at the end of this command
- `specs/<path>.md` references are shared workflow docs shipped with this extension — read them from the `specs/` directory in the extension installation folder. If the path matches a Wire command (e.g. `specs/requirements/generate.md`), it means that command (`/wire requirements generate`) and its spec is already embedded in the command file.

